name: Docs

# Builds the MkDocs site and deploys to GitHub Pages.
# Triggered on push to main (auto-deploy) and manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package with docs extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build + deploy to gh-pages branch
        run: mkdocs gh-deploy --force
