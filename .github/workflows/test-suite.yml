name: Test Suite

# Action versions pinned to the Node 24-compatible major (see docs.yml for
# the rationale). v4 / v5 still work but emit a deprecation warning on
# every run that surfaces as a GH notification — bump together.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: "actions/checkout@v5"

      - uses: "actions/setup-python@v6"
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # sustech_survival is SUSTech-only; all students are in Asia/Shanghai
      # (UTC+8). Test fixtures use naive datetimes that mean "Beijing local
      # time" — pin TZ here so CI matches every developer's machine.
      - name: "Install package (core deps + test extras)"
        env:
          TZ: "Asia/Shanghai"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: "Static check (undefined names)"
        # F821 caught real dead code that the browser-backed TIS evaluation
        # flows and the module registries could reach only at runtime
        # (issues #36, #37). Cheap gate, no formatting churn.
        env:
          TZ: "Asia/Shanghai"
        run: |
          pip install ruff
          ruff check --select F821 src/sustech_survival

      - name: "Run tests"
        env:
          TZ: "Asia/Shanghai"
        run: |
          pytest -m "not live" -ra --strict-markers --strict-config

  desktop-tests:
    name: "Electron launcher protocol (Node 22)"
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v5"
      - uses: "actions/setup-node@v5"
        with:
          node-version: "22"
      - name: "Test desktop configuration and launch flow (mocked)"
        run: node --test electron/test/*.test.js
