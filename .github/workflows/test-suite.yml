name: Test Suite

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: "actions/checkout@v4"

      - uses: "actions/setup-python@v5"
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: "Install package (core deps)"
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: "Run tests"
        run: |
          pytest -m "not live" -ra --strict-markers --strict-config