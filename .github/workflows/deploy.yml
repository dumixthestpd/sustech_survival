name: Deploy release

# Publishes to PyPI when a version tag is pushed.
# Uses PyPI trusted publishing (OIDC) — no API token in secrets required.
#
# Setup once, before the first release:
#   1. On https://pypi.org/manage/account/publishing/ :
#      - Add a new pending publisher
#      - Owner: dumixthestpd  /  Repository: sustech_survival
#      - Workflow filename: deploy.yml
#      - Environment name: (leave blank — this workflow has no `environment:`)
#   2. Bump `_version.py` to a release version (e.g. 2026.7.14b1)
#   3. Update CHANGELOG.md (cut `[Unreleased]` into a dated version section)
#   4. `git tag 2026.7.14b1 && git push --tags`
#
# Live (requires-network) tests are skipped via the default `-m "not live"`.
#
# PyPI is currently disabled (see commit history). The PyPI publish step
# is gated behind the `PUBLISH_TO_PYPI` repository variable so a stray tag
# push doesn't fail CI with a noisy PyPI trusted-publisher error. Set the
# variable to `true` (in repo Settings → Secrets and variables → Actions
# → Variables) once a trusted publisher is registered, and the step runs
# again.

on:
  push:
    tags:
      - "*"

jobs:
  build:
    # Always run: verifies the sdist + wheel actually build for the
    # tagged commit. Cheap (sdist + wheel only, no upload).
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v5"

      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"

      - name: "Install build tooling"
        run: python -m pip install --upgrade build

      - name: "Build sdist + wheel"
        run: python -m build

  pypi:
    needs: build
    # Only run when explicitly enabled via repo variable. Without this,
    # every tag push fails with "Publisher with matching claims was not
    # found" once PyPI trusted publishing stops being maintained.
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    permissions:
      id-token: write  # OIDC trusted publishing
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v5"

      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"

      - name: "Install build tooling"
        run: python -m pip install --upgrade build

      - name: "Build sdist + wheel"
        run: python -m build

      - name: "Publish to PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
