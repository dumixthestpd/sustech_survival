<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<title>南科大生存指南 — Web UI</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
       background:#0f1216;color:#e7e9ee;min-height:100vh;display:flex;flex-direction:column}
    html:lang(zh) body{line-height:1.65;letter-spacing:.01em}

  header{padding:2rem 2.5rem;border-bottom:1px solid #1f2530}
  header h1{font-size:1.6rem;font-weight:600;letter-spacing:.3px}
  header h1 span{color:#5b9dff}
  header p{margin-top:.3rem;color:#8a93a3;font-size:.92rem}
  main{flex:1;padding:2.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.5rem}
  .card{background:#161b22;border:1px solid #232a36;border-radius:12px;padding:1.6rem;
        text-decoration:none;color:inherit;transition:transform .15s,background .15s}
  .card:hover{transform:translateY(-3px);background:#19202a}
  .card .icon{font-size:2.4rem}
  .card h2{margin-top:.8rem;font-size:1.25rem}
  .card p{margin-top:.4rem;color:#8a93a3;font-size:.9rem;line-height:1.5}
  .card .tag{display:inline-block;margin-top:.8rem;padding:.2rem .6rem;border-radius:6px;
             background:#1e2733;color:#7fb0ff;font-size:.72rem;letter-spacing:.5px}
  footer{padding:1.2rem 2.5rem;border-top:1px solid #1f2530;color:#5a6373;font-size:.78rem}
  a{color:#5b9dff}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:1rem">
    <img src="/logo-full.svg" alt="sustech-survival" style="height:3rem;width:auto">
    <div>
      <h1>SUSTech <span>Survival</span> — Web UI</h1>
      <p>一个端口，一个入口。选择一个子模块继续。</p>
    </div>
  </div>
</header>
<main>
  <a class="card" href="/tis">
    <div class="icon">📅</div>
    <h2>TIS 选课系统</h2>
    <p>浏览课程目录、搜索课程、构建无冲突的每周课表、查看 NCES 同学评价，并试运行加/退课。</p>
    <span class="tag">/tis</span>
  </a>
  <a class="card" href="/transit">
    <div class="icon">🚌</div>
    <h2>校园交通 — 地图</h2>
    <p>实时校巴 GPS、时刻表，以及基于 MapLibre + PMTiles 的校园地图。</p>
    <span class="tag">/transit</span>
  </a>
</main>
<footer>南科大生存指南 · 统一 Web UI · <a href="/api/tis/info">TIS API</a></footer>
</body>
</html>
