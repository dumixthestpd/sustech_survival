<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUSTech Transit — Campus Map &amp; Bus</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🚌 SUSTech Transit</h1>
    <div class="subtitle">Campus navigation &amp; live bus positions</div>
    <div class="header-actions">
      <button id="refresh-btn" title="Reload live data">↻ Refresh</button>
      <span id="last-update"></span>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <section class="panel">
        <h2>🚏 Route</h2>
        <label>From
          <input id="from-input" type="text" placeholder="search name or facility_id…" autocomplete="off" />
          <ul id="from-suggestions" class="suggestions"></ul>
        </label>
        <label>To
          <input id="to-input" type="text" placeholder="search name or facility_id…" autocomplete="off" />
          <ul id="to-suggestions" class="suggestions"></ul>
        </label>
        <fieldset>
          <legend>Mode</legend>
          <label><input type="radio" name="mode" value="transit" checked /> 🚶+🚌 Transit</label>
          <label><input type="radio" name="mode" value="walk" /> 🚶 Walk only</label>
          <label><input type="radio" name="mode" value="bus" /> 🚌 Bus only</label>
        </fieldset>
        <button id="route-btn">Find route</button>
        <div id="route-result"></div>
      </section>

      <section class="panel">
        <h2>🕐 Bus schedule</h2>
        <div class="day-toggle">
          <button data-day="workday" class="active">Workday</button>
          <button data-day="holiday">Weekend/Holiday</button>
        </div>
        <div id="schedule-content">Loading…</div>
      </section>

      <section class="panel">
        <h2>📍 Live buses</h2>
        <div id="live-content">Loading…</div>
      </section>
    </aside>

    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/app.js"></script>
</body>
</html>
