<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUSTech Transit — Campus Map &amp; Bus</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🚌 SUSTech Transit</h1>
    <div class="subtitle">Campus map &amp; live bus positions</div>
    <div class="header-actions">
      <button id="refresh-btn" title="Reload live data">↻ Refresh</button>
      <span id="last-update"></span>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <section class="panel">
        <h2>🕐 Bus schedule</h2>
        <div class="day-toggle">
          <button data-day="workday" class="active">Workday</button>
          <button data-day="holiday">Weekend/Holiday</button>
        </div>
        <div id="schedule-content">Loading…</div>
      </section>

      <section class="panel">
        <h2>📍 Live buses</h2>
        <div id="live-content">Loading…</div>
      </section>

      <section class="panel" id="hover-info" style="display:none">
        <h2>📌 Hover a dot</h2>
        <div id="hover-content"></div>
      </section>
    </aside>

    <div id="map"></div>
  </main>

  <!-- MapLibre GL JS + Protomaps pmtiles (handles HTTP-range reads of the 130GB PMTiles file) -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
