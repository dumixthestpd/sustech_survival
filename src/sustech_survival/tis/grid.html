<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课表可视化</title>
<style>
  :root {
    --cell-h: 52px;
    --header-h: 36px;
    --time-w: 80px;
    --day-w: 130px;
    --border: 1px solid #e0e0e0;
    --radius: 6px;
    --shadow: 0 2px 8px rgba(0,0,0,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }

  .topbar {
    background: #fff; border-bottom: var(--border); padding: 12px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar h1 { font-size: 18px; font-weight: 700; color: #1a1a2e; }
  .topbar .sem { font-size: 13px; color: #666; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 6px 16px; border: var(--border); border-radius: 20px; cursor: pointer;
    font-size: 13px; background: #fff; color: #555; transition: all .15s;
  }
  .tab.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }
  .tab:hover:not(.active) { background: #f0f0f0; }
  .info { font-size: 12px; color: #888; margin-left: auto; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600; background: #e8f0fe; color: #1a73e8;
  }

  .container { display: flex; gap: 16px; padding: 16px 24px; align-items: flex-start; }

  .schedule-nav {
    background: #fff; border-radius: 12px; padding: 16px; width: 180px; flex-shrink: 0;
    border: var(--border); box-shadow: var(--shadow);
  }
  .schedule-nav h3 { font-size: 13px; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
  .nav-item {
    padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
    color: #555; margin-bottom: 4px; transition: all .1s;
  }
  .nav-item:hover { background: #f5f5f5; }
  .nav-item.active { background: #1a1a2e; color: #fff; }
  .nav-item .n { font-weight: 600; }
  .nav-item .sub { font-size: 11px; opacity: .7; }

  .grid-wrap { flex: 1; overflow-x: auto; }
  .grid {
    display: grid;
    grid-template-columns: var(--time-w) repeat(5, var(--day-w));
    border: var(--border); border-radius: 12px; overflow: hidden;
    background: #fff; box-shadow: var(--shadow); min-width: 700px;
  }
  .corner {
    background: #1a1a2e; color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border-right: var(--border); position: sticky; left: 0; z-index: 2;
  }
  .day-header {
    background: #f8f9fa; font-size: 13px; font-weight: 700; color: #333;
    text-align: center; padding: 8px 4px; border-right: var(--border);
    border-bottom: var(--border);
  }
  .time-cell {
    background: #fafafa; font-size: 11px; color: #888; text-align: center;
    padding: 4px; border-right: var(--border); border-bottom: var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px;
  }
  .time-cell .period { font-size: 13px; font-weight: 700; color: #333; }
  .time-cell .clock { font-size: 10px; color: #aaa; }
  .cell {
    border-right: var(--border); border-bottom: var(--border);
    height: var(--cell-h); position: relative; padding: 2px;
    vertical-align: top;
  }
  .cell.sat, .cell.sun { background: #fafafa; }

  .card {
    border-radius: var(--radius); padding: 5px 7px; font-size: 12px;
    color: #fff; overflow: hidden; cursor: default; height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    transition: filter .15s; position: relative;
  }
  .card:hover { filter: brightness(1.1); }
  .card .name { font-weight: 700; font-size: 12px; line-height: 1.3; }
  .card .teacher { font-size: 10px; opacity: .85; }
  .card .room { font-size: 10px; opacity: .7; margin-top: 1px; }
  .card .weeks-badge {
    position: absolute; top: 3px; right: 4px;
    font-size: 9px; background: rgba(0,0,0,.25); padding: 1px 4px;
    border-radius: 8px;
  }

  /* Period-level sub-grid within cell */
  .period-slots { display: flex; flex-direction: column; height: 100%; gap: 1px; }
  .period-slot { flex: 1; border-radius: 4px; overflow: hidden; }

  /* Loading / empty states */
  .loading { text-align: center; padding: 60px; color: #888; font-size: 15px; }
  .hint { font-size: 11px; color: #aaa; text-align: center; padding: 8px; }

  /* Schedule count */
  .count { font-size: 12px; color: #888; }
  .count strong { color: #1a1a2e; }

  /* Tooltip */
  .tooltip {
    position: fixed; background: rgba(20,20,40,.92); color: #fff;
    padding: 10px 14px; border-radius: 8px; font-size: 12px;
    max-width: 240px; z-index: 9999; pointer-events: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.3); display: none;
  }
  .tooltip .tt-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .tooltip .tt-row { display: flex; gap: 8px; margin-top: 2px; }
  .tooltip .tt-label { color: rgba(255,255,255,.5); }
</style>
</head>
<body>

<div class="topbar">
  <h1>📅 课表可视化</h1>
  <span class="sem" id="semLabel">—</span>
  <div class="tabs">
    <div class="tab active" data-week="0" onclick="setWeek(0)">单周</div>
    <div class="tab" data-week="1" onclick="setWeek(1)">双周</div>
    <div class="tab" data-week="2" onclick="setWeek(2)">全部</div>
  </div>
  <span class="count" id="countLabel"></span>
  <span class="info">← → 切换课表</span>
</div>

<div class="container">
  <div class="schedule-nav" id="scheduleNav">
    <h3>课表列表</h3>
    <div id="navList"></div>
  </div>
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tt-name"></div>
  <div class="tt-row"><span class="tt-label">课程:</span> <span class="tt-code"></span></div>
  <div class="tt-row"><span class="tt-label">教师:</span> <span class="tt-teacher"></span></div>
  <div class="tt-row"><span class="tt-label">教室:</span> <span class="tt-room"></span></div>
  <div class="tt-row"><span class="tt-label">周次:</span> <span class="tt-weeks"></span></div>
  <div class="tt-row"><span class="tt-label">节次:</span> <span class="tt-periods"></span></div>
</div>

<script>
// -- Palette ------------------------------------------------------------------
const PALETTE = [
  "#4A90D9","#50C878","#E0746B","#9B59B6","#F5A623",
  "#1ABC9C","#E74C3C","#3498DB","#2ECC71","#F39C12",
  "#8E44AD","#16A085","#C0392B","#2980B9","#27AE60",
  "#D35400","#7F8C8D","#2C3E50","#C0392B","#1F5563",
];
const DAYS = ["周一","周二","周三","周四","周五","周六","周日"];
const DAY_CSS = ["","sat","sun","","","",""];
const TIMES = [
  ["1-2","08:00-09:50"],["3-4","10:20-12:10"],["5-6","14:00-15:50"],
  ["7-8","16:20-18:10"],["9-10","19:00-20:50"],["11","21:00-21:50"],
  ["12","21:50-22:40"],
];

// -- State -------------------------------------------------------------------
let schedules = [];
let currentIdx = 0;
let currentWeek = 0; // 0=odd, 1=even, 2=all

// -- Init ---------------------------------------------------------------------
async function init() {
  const resp = await fetch('schedules.json');
  schedules = await resp.json();
  document.getElementById('semLabel').textContent = schedules[0]?.semester || '';
  renderNav();
  render();
}

// -- Week tabs ----------------------------------------------------------------
function setWeek(w) {
  currentWeek = w;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', parseInt(t.dataset.week) === w);
  });
  render();
}

// -- Nav ----------------------------------------------------------------------
function renderNav() {
  const el = document.getElementById('navList');
  el.innerHTML = schedules.map((s, i) => `
    <div class="nav-item${i===currentIdx?' active':''}" onclick="go(${i})">
      <div class="n">方案 ${i+1}</div>
      <div class="sub">${s.courses.length}门课 · ${s.conflict?"⚠冲突":"✓无冲突"}</div>
    </div>
  `).join('');
  document.getElementById('countLabel').innerHTML =
    `共 <strong>${schedules.length}</strong> 个课表`;
}

function go(i) {
  currentIdx = i;
  renderNav();
  render();
}

// -- Grid ---------------------------------------------------------------------
function render() {
  const sch = schedules[currentIdx];
  if (!sch) return;
  const grid = document.getElementById('grid');
  const week = currentWeek;

  // Build header rows
  let html = `<div class="corner">时间 / 星期</div>`;
  for (let d = 0; d < 5; d++) {
    html += `<div class="day-header">${DAYS[d]}</div>`;
  }

  for (let row = 0; row < 7; row++) {
    const [pname, ptime] = TIMES[row];
    html += `<div class="time-cell">
      <span class="period">${pname}</span>
      <span class="clock">${ptime}</span>
    </div>`;
    for (let d = 0; d < 5; d++) {
      html += `<div class="cell ${DAY_CSS[d]}">
        ${buildCell(sch, row, d, week)}
      </div>`;
    }
  }

  grid.innerHTML = html;
}

function buildCell(sch, periodRow, dayIdx, weekFilter) {
  // periodRow: 0=1-2, 1=3-4, ..., 6=12
  const periodStart = periodRow * 2 + 1; // 1,3,5,7,9,11,12
  const periodEnd = periodRow < 6 ? periodStart + 1 : periodStart; // 2,4,6,8,10,12,12

  let cards = [];
  for (const c of sch.courses) {
    for (const slot of (c.slots || [])) {
      if (!matchesSlot(slot, dayIdx, periodStart, periodEnd, weekFilter)) continue;
      cards.push({ c, slot });
    }
  }

  if (cards.length === 0) return '';

  if (cards.length === 1) {
    const { c, slot } = cards[0];
    return buildCard(c, slot, weekFilter);
  }

  // Multiple courses → stack
  return `<div class="period-slots">${
    cards.map(({ c, slot }) =>
      `<div class="period-slot">${buildCard(c, slot, weekFilter)}</div>`
    ).join('')
  }</div>`;
}

function matchesSlot(slot, dayIdx, periodStart, periodEnd, weekFilter) {
  // slot: { day: 0-6, periods: [n,n], weeks: set, weekType }
  if (slot.day !== dayIdx) return false;
  const slotPeriods = slot.periods || [];
  const overlap = slotPeriods.some(p => p >= periodStart && p <= periodEnd);
  if (!overlap) return false;

  const wType = slot.weekType || 'all';
  if (weekFilter === 0 && wType === 'even') return false;
  if (weekFilter === 1 && wType === 'odd') return false;
  return true;
}

let colorIdx = 0;
function getColor(idx) {
  return PALETTE[idx % PALETTE.length];
}

function buildCard(c, slot, weekFilter) {
  const ci = colorIdx++;
  const color = getColor(ci);
  const weekType = slot.weekType || 'all';
  const weekBadge = weekType === 'odd' ? '单周' : weekType === 'even' ? '双周' : '';
  const periods = (slot.periods || []).join(',');
  return `<div class="card" style="background:${color}"
    onmouseenter="showTip(event,${ci})" onmouseleave="hideTip()">
    ${weekBadge ? `<span class="weeks-badge">${weekBadge}</span>` : ''}
    <div class="name">${c.name}</div>
    <div class="teacher">${c.teacher}</div>
    <div class="room">${slot.room || ''}</div>
  </div>`;
}

// -- Tooltip ------------------------------------------------------------------
const tooltipData = [];
function showTip(event, ci) {
  const tip = document.getElementById('tooltip');
  const sch = schedules[currentIdx];
  // Find course by color index — rough match
  // Store actual data in a map
  if (!tooltipData[ci]) return;
  const d = tooltipData[ci];
  tip.querySelector('.tt-name').textContent = d.name;
  tip.querySelector('.tt-code').textContent = d.code;
  tip.querySelector('.tt-teacher').textContent = d.teacher;
  tip.querySelector('.tt-room').textContent = d.room || '—';
  tip.querySelector('.tt-weeks').textContent = d.weeks;
  tip.querySelector('.tt-periods').textContent = d.periods;
  tip.style.display = 'block';
  tip.style.left = (event.clientX + 14) + 'px';
  tip.style.top = (event.clientY - 10) + 'px';
}
function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}

// -- Keyboard nav -------------------------------------------------------------
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { go(Math.min(currentIdx+1, schedules.length-1)); }
  if (e.key === 'ArrowLeft')  { go(Math.max(currentIdx-1, 0)); }
  if (e.key === '1') setWeek(0);
  if (e.key === '2') setWeek(1);
  if (e.key === '3') setWeek(2);
});

// -- JSON export from Python solver ------------------------------------------
// Python writes: schedules = [{semester, courses: [{code, name, teacher, slots: [{day, periods, weeks, weekType, room}]}]}]
init().catch(console.error);
</script>
</body>
</html>
