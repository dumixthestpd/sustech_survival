site_name: sustech_survival
site_description: A unified Python toolkit for SUSTech academic systems 鈥?BB, TIS, library, papers, transit, and more.
site_url: https://dumixthestpd.github.io/sustech_survival/
repo_url: https://github.com/dumixthestpd/sustech_survival
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
        - locale: zh
          name: 绠€浣撲腑鏂?          build: true
          nav_translations:
            Home: 棣栭〉
            Core Systems: 鏍稿績绯荤粺
            External Databases: 澶栭儴鏁版嵁搴?            Reference: 鍙傝€?            BB (Blackboard): BB锛圔lackboard锛?            TIS: 鏁欏淇℃伅鏈嶅姟
            TIS Courses: 璇剧▼
            TIS Grades: 鎴愮哗
            SSO: 鍗曠偣鐧诲綍
            PMS: 鑱斿垱鎵撳嵃
            Faculty: 鏁欏笀淇℃伅
            Transit: 鏍″洯宸村＋
            Selectcourse: 閫夎
            Context: 涓婁笅鏂?            Papers: 璁烘枃
            NCES: 璇剧▼璇勪环
            WS: 澶栦簨
            "E-Hall Booking": 鍦哄湴棰勭害
            Library Booking: 鍥句功棣嗛绾?            "Library (Primo)": 鍥句功棣嗭紙Primo锛?            Calendar: 鏍″巻
            Web UI: Web 鐣岄潰
            CNKI: CNKI
            RSC: RSC
            WoS: WoS
            Resources: 璧勬簮
      fallback_to_default: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
  - footnotes

nav:
  - Home: index.md
  - Core Systems:
      - BB (Blackboard): bb.md
      - TIS: tis.md
      - TIS Courses: courses.md
      - TIS Grades: grades.md
      - SSO: sso.md
      - PMS: pms.md
      - Faculty: faculty.md
      - Transit: transit.md
      - Selectcourse: selectcourse.md
      - Context: context.md
      - Papers: papers.md
      - NCES: nces.md
      - WS: ws.md
      - E-Hall Booking: booking.md
      - Library Booking: lib-booking.md
      - Library (Primo): lib.md
      - Calendar: calendar.md
      - Web UI: webui.md
  - External Databases:
      - CNKI: cnki.md
      - RSC: rsc.md
      - WoS: wos.md
  - Reference:
      - Resources: resources.md
