[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "sustech-survival"
description = "sustech_survival is a Python module that allows API-level SUSTech service calls. It satisfies everyday needs of SUSTech students including BB, TIS, library, PMS, and more."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
authors = [
    { name = "dumix", email = "dumix@local" },
]
keywords = [
    "sustech",
    "blackboard",
    "sso",
    "cas",
    "tis",
    "shibboleth",
    "academic",
    "library",
    "transit",
    "papers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28",
    "click>=8.1",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "PyYAML>=6.0",
    "urllib3>=2.0",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
# CLI support (click) is in core deps — [project.scripts] ships a `sustech` entry point.
# Each group below adds one capability on top of the core library.
webui = [
    # Unified web UI at / — TIS course selector + transit map + future submodules.
    "flask>=2.3",
]
playwright = [
    # Browser automation used by: Library Primo search (lib.search), SSO
    # provider brokers (sso), paper DB fetchers (papers), TIS eval (tis.eval).
    # NOTE: bb (Blackboard) submission/download is pure REST and does NOT
    # need this extra.
    "playwright>=1.40",
]
nces = [
    # NCES community course eval — Anubis PoW solver for listing scrape.
    "anubis-solver>=0.1",
]
papers = [
    # Academic paper fetch — cloudscraper for publisher sites that block plain requests.
    "cloudscraper>=1.3",
]
pms = [
    # PMS auth — pycryptodome for RSA password encryption (联创 PMS).
    "pycryptodome>=3.15",
]
docs = [
    # MkDocs site build for docs/en/ + docs/zh/ — only needed by doc authors.
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
]
all = [
    "sustech-survival[playwright,webui,nces,papers,pms]",
    # Note: [docs] is intentionally NOT in [all] — it's a doc-author-only
    # extra. Library users don't need MkDocs.
]

[project.urls]
Homepage = "https://github.com/dumixthestpd/sustech-survival"
Documentation = "https://github.com/dumixthestpd/sustech-survival#readme"
Issues = "https://github.com/dumixthestpd/sustech-survival/issues"
Changelog = "https://github.com/dumixthestpd/sustech-survival/blob/main/CHANGELOG.md"

[project.scripts]
# Unified subcommand dispatcher — `sustech bb`, `sustech tis`, etc.
# Each <sub> mounts the existing `sustech_survival.<sub>.cli:cli` Click group.
sustech = "sustech_survival.cli:cli"

# Legacy flat entry points (kept for backward compat).
# Each points at the Click group `cli` in the submodule (not `main`,
# which doesn't exist on these modules).
sustech-bb = "sustech_survival.bb.cli:cli"
sustech-tis = "sustech_survival.tis.cli:cli"
sustech-ws = "sustech_survival.ws.cli:cli"

[tool.hatch.version]
path = "src/sustech_survival/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sustech_survival"]
include = [
    "src/sustech_survival/py.typed",
    "src/sustech_survival/**/*.py",
    # Non-Python assets shipped with the package.
    "src/sustech_survival/resources/**/*",
    "src/sustech_survival/references/**/*.md",
    "src/sustech_survival/docs/**/*.md",
    # context profile template.
    "src/sustech_survival/context/templates/**/*",
    # Web UI assets (templates + transit frontend).
    "src/sustech_survival/webui/templates/**/*.html",
    "src/sustech_survival/transit/web/**/*",
]
exclude = [
    "src/sustech_survival/**/__pycache__",
    "src/sustech_survival/**/*.pyc",
    "src/sustech_survival/**/test_*.py",
    "src/sustech_survival/**/*_test.py",
    "src/sustech_survival/**/.cache",
    "src/sustech_survival/**/cache/**",
    "src/sustech_survival/credentials.txt",
    "src/sustech_survival/credentials.example.txt",
    "src/sustech_survival/**/session.json",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/sustech_survival",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    "docs",
]
exclude = [
    ".git",
    ".github",
    "**/__pycache__",
    "**/*.pyc",
    "**/.pytest_cache",
    "**/cache",
    "**/credentials.txt",
    "**/session.json",
]

[tool.hatch.build.targets.wheel.shared-data]
"src/sustech_survival/resources" = "sustech_survival/resources"

# ── Pytest (used by `pip install -e .[all]` + dev workflow) ──────────────

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src/test"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not live",
]
markers = [
    "live: marks tests as live (require network + valid session)"]

# ── Black + isort (code style) ─────────────────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["sustech_survival"]
